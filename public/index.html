<!DOCTYPE html>
<!-- Mini GO Transit 3D — forked from nagix/mini-tokyo-3d (MIT License).
     Default view: GO Transit (Greater Toronto and Hamilton Area) via GTFS. -->
<html lang="en" style="overscroll-behavior: none;">
<head>
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-XXXXXXXXXX');
	</script>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="mini-tokyo-3d.min.css" />
	<title>Mini GO Transit 3D</title>
	<meta name="description" content="A real-time 3D digital map of GO Transit in the Greater Toronto and Hamilton Area." />
	<meta name="viewport" content="user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, width=device-width, height=device-height, initial-scale=1" />
	<meta property="og:title" content="Mini GO Transit 3D" />
	<meta property="og:description" content="A real-time 3D digital map of GO Transit in the Greater Toronto and Hamilton Area." />
	<meta property="og:locale" content="en_US" />
	<link rel="canonical" href="https://zhenhuasun.github.io/mini-gotransit-3d/" />
	<meta property="og:url" content="https://zhenhuasun.github.io/mini-gotransit-3d/" />
	<meta property="og:site_name" content="Mini GO Transit 3D" />
	<meta name="twitter:card" content="summary_large_image" />
	<script src="mini-tokyo-3d.min.js"></script>
	<!-- plugins -->
</head>
<body style="width: 100%; height: 100%; margin: 0; padding: 0; position: absolute;">
	<div id="map" style="width: 100%; height: 100%;"></div>
	<script>
		const matchLang = location.search.match(/lang=(.*?)(?:&|$)/),
			matchSelection = location.search.match(/selection=(.*?)(?:&|$)/),
			matchGtfsUrl = location.search.match(/gtfsurl=(.*?)(?:&|$)/),
			matchVehiclePositionUrl = location.search.match(/gtfsvpurl=(.*?)(?:&|$)/),
			matchGtfsColor = location.search.match(/gtfscolor=(.*?)(?:&|$)/),
			matchHash = location.hash.match(/[^\d\.\-]*([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)/),
			options = {
				container: 'map',
				plugins: [],
				// Mini GO Transit 3D defaults: GTHA view, GO Transit GTFS feed.
				// The daily data pipeline keeps GO-GTFS-slim.zip fresh; the
				// realtime feed is served by the go-3d-tracker Cloudflare Worker.
				center: [-79.38, 43.65],
				zoom: 10,
				pitch: 60,
				dataUrl: '',
				dataSources: [{
					id: 'go',
					gtfsUrl: 'https://raw.githubusercontent.com/zhenhuasun/go-3d-tracker/main/gtfs/GO-GTFS-slim.zip',
					vehiclePositionUrl: 'https://go-3d-tracker-proxy.zhenhuasun.workers.dev/api/gtfs-rt/vp',
					color: '#00A651'
				}]
			};

		// overrides
		if (matchLang) {
			options.lang = decodeURIComponent(matchLang[1]);
		}
		if (matchSelection) {
			options.selection = decodeURIComponent(matchSelection[1]);
		}
		if (matchHash[1]) {
			options.zoom = +matchHash[1];
		}
		if (matchHash[2] && matchHash[3]) {
			options.center = [+matchHash[3], +matchHash[2]];
		}
		if (matchHash[4]) {
			options.bearing = +matchHash[4];
		}
		if (matchHash[5]) {
			options.pitch = +matchHash[5];
		}
		if (matchGtfsUrl && matchGtfsColor) {
			// Show only the specified GTFS feed (which may be outside Japan) and let
			// its agency_timezone drive the clock, instead of the default GO data.
			options.dataUrl = '';
			options.dataSources = [{
				id: 'gtfs',
				gtfsUrl: decodeURIComponent(matchGtfsUrl[1]),
				vehiclePositionUrl: matchVehiclePositionUrl ? decodeURIComponent(matchVehiclePositionUrl[1]) : undefined,
				color: `#${decodeURIComponent(matchGtfsColor[1])}`
			}];
		}

		const map = new mt3d.Map(options);
	</script>
</body>
</html>
